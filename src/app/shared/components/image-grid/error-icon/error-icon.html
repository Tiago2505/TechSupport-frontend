<div
  class="flex items-start gap-3 rounded-xl border border-error/20 bg-error/10 px-4 py-3 text-error animate-in fade-in duration-200 mt-2"
>
  <div
    class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-error text-error-content"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-3.5 w-3.5"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="8" x2="12" y2="12" />
      <line x1="12" y1="16" x2="12.01" y2="16" />
    </svg>
  </div>

  <div class="flex flex-col">
    <span class="text-sm font-semibold"> Error </span>

    <span class="text-xs leading-relaxed text-error/90">
      <strong> {{errorText()}} </strong>
    </span>
  </div>
</div>
