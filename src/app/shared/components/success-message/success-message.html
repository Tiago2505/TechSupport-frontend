<div
  class="w-full animate-[slideIn_.35s_ease-out] rounded-2xl border border-success/20 bg-base-100 p-4 shadow-xl"
>
  <div class="flex items-start gap-3">
    <!-- Icono -->
    <div
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-success/10 text-success"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        class="h-6 w-6"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>

    <!-- Mensaje -->
    <div class="min-w-0 flex-1">
      <h3 class="font-semibold text-base-content">{{messageTitle()}}</h3>

      <p class="mt-1 text-sm leading-5 text-base-content/60">
        {{messageContent()}}
      </p>
    </div>

    <!-- Cerrar -->
    <button
      type="button"
      class="btn btn-ghost btn-sm btn-circle shrink-0 text-base-content/40 hover:bg-base-200 hover:text-base-content"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        class="h-4 w-4"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Barra de duración -->
  <div class="mt-3 h-1 overflow-hidden rounded-full bg-success/10">
    <div
      class="h-full w-full origin-left rounded-full bg-success animate-[shrink_4s_linear_forwards]"
    ></div>
  </div>
</div>
