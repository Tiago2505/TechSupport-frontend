<nav class="sticky top-0 z-40 border-b border-base-300 bg-base-100/95 shadow-sm">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <!-- LOGO / HOME -->
    <button
      type="button"
      class="group flex items-center gap-3 text-left"
      (click)="goToHome()"
      aria-label="Ir al inicio"
    >
      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary text-primary-content shadow-sm transition-transform group-hover:scale-105"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12M6 12h12" />
        </svg>
      </div>

      <div class="hidden sm:block">
        <h1 class="text-lg font-bold text-base-content">Tech Support</h1>
        <p class="text-xs text-base-content/50">Soporte técnico inteligente</p>
      </div>
    </button>

    <!-- OPCIONES -->
    @if (currentUser()) {
      <authenticated-navbar [currentUser]="currentUser()!" />
    } @else {
      <div class="flex items-center gap-2 sm:gap-3">
        <button type="button" class="btn btn-ghost rounded-xl" (click)="goToLogin()">
          Iniciar sesión
        </button>

        <button type="button" class="btn btn-primary rounded-xl" (click)="goToRegister()">
          Crear cuenta
        </button>
      </div>
    }
  </div>
</nav>
