<div class="flex items-center gap-2 sm:gap-3">
  <!-- INICIO -->
  <a
    type="button"
    class="btn btn-ghost gap-2 rounded-xl"
    routerLink="/home"
    routerLinkActive="bg-primary text-primary-content"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-5 w-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1.8"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5L12 3l9 7.5" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M5.5 9.5V21h13V9.5" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M9.5 21v-6h5v6" />
    </svg>

    <span class="hidden sm:inline">Inicio</span>
  </a>

  <!-- MIS GESTIONES -->
  @if (currentUser().role === 'USER') {
    <a
      class="btn btn-ghost gap-2 rounded-xl"
      routerLink="/tickets/my-tickets"
      routerLinkActive="bg-primary text-primary-content"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"
        />

        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5a3 3 0 016 0v1H9V5z" />

        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6M9 16h4" />
      </svg>

      <span class="hidden sm:inline">Mis gestiones</span>
    </a>
  } @else if (currentUser().role === 'TECHNICIAN') {
    <!-- GESTIONES -->
    <a
      class="btn btn-ghost gap-2 rounded-xl"
      routerLink="/tickets/technician-tickets"
      routerLinkActive="bg-primary text-primary-content"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"
        />

        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5a3 3 0 016 0v1H9V5z" />

        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6M9 16h4" />
      </svg>

      <span class="hidden sm:inline">Gestiones</span>
    </a>
  } @else {
    <!-- DASHBOARD -->
    <a
      class="btn btn-ghost gap-2 rounded-xl"
      routerLink="/admin/dashboard"
      routerLinkActive="bg-primary text-primary-content"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 13h8V3H3v10zm10 8h8V11h-8v10zM3 21h8v-6H3v6zm10-18v5h8V3h-8z"
        />
      </svg>

      <span class="hidden sm:inline">Dashboard</span>
    </a>
  }

  <!-- PERFIL -->
  <profile [currentUser]="currentUser()!" />
</div>
