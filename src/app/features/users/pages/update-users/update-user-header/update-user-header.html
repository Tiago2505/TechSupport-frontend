<section
  class="overflow-hidden rounded-2xl border border-warning/20 bg-gradient-to-br from-warning/10 via-base-100 to-base-100 shadow-sm"
>
  <div class="p-5 sm:p-6">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div class="flex items-start gap-4">
        <div
          class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-warning text-warning-content shadow-sm"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4L16.5 3.5Z"
            />
            <path stroke-linecap="round" stroke-linejoin="round" d="m14 6 4 4" />
          </svg>
        </div>

        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-2">
            <h1 class="text-lg font-bold text-base-content sm:text-xl">Actualizar usuario</h1>

            <span
              class="rounded-full border border-warning/20 bg-warning/10 px-2 py-0.5 text-[9px] font-bold uppercase tracking-wider text-warning"
            >
              Edición
            </span>
          </div>

          <p class="mt-1 max-w-xl text-xs leading-5 text-base-content/50 sm:text-sm">
            Modifica la información y configuración de la cuenta del usuario.
          </p>
        </div>
      </div>

      <!-- USER ID -->
      <div
        class="flex shrink-0 items-center gap-2 rounded-xl border border-base-300/70 bg-base-100/70 px-3.5 py-2.5"
      >
        <span class="text-[9px] font-bold uppercase tracking-wider text-base-content/35">
          Usuario
        </span>

        <span class="text-xs font-bold text-base-content"> #{{ userId() }} </span>
      </div>
    </div>
  </div>
</section>
