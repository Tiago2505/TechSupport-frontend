<div class="flex min-h-[420px] items-center justify-center px-4 py-10">
  <div class="w-full max-w-md text-center">
    <!-- ICON -->
    <div
      class="mx-auto flex h-20 w-20 items-center justify-center rounded-3xl bg-primary/10 text-primary"
    >
      <empty-tickets-header-icon />
    </div>

    <!-- CONTENT -->
    <div class="mt-6">
      <h2 class="text-xl font-bold tracking-tight text-base-content sm:text-2xl">
        No tienes tickets todavía
      </h2>

      <p class="mx-auto mt-2 max-w-sm text-sm leading-6 text-base-content/55">
        Cuando necesites soporte, crea una solicitud y podrás consultar aquí su estado y
        seguimiento.
      </p>
    </div>

    <!-- ACTION -->
    <button
      type="button"
      class="btn btn-primary mt-6 rounded-xl px-5 shadow-sm shadow-primary/20 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md hover:shadow-primary/25"

      (click)="goToCreateTicket()"
    >
      <empty-tickets-button-icon />

      Crear ticket
    </button>
  </div>
</div>
