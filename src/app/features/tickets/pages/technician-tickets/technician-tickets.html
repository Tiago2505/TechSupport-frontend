@if (allTicketsRxResource.hasValue()) {
  <div class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 lg:px-8">
    <!-- HEADER -->
    <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-[10px] font-semibold uppercase tracking-[0.15em] text-primary">
          Panel de soporte
        </p>

        <h2 class="mt-1 text-2xl font-bold tracking-tight text-base-content">Solicitudes</h2>

        <p class="mt-1 text-sm text-base-content/50">Solicitudes que requieren atención técnica.</p>
      </div>

      <ticket-sort-controls [sortAsQueue]="sortAsQueue" [sortAsStack]="sortAsStack" />

      <div
        class="flex items-center gap-2 self-start rounded-xl border border-base-300 bg-base-100 px-3 py-2 shadow-sm sm:self-auto"
      >
        <span
          class="flex h-7 w-7 items-center justify-center rounded-lg bg-primary/10 text-primary"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M8 7h8M8 11h5M6.5 3h11A2.5 2.5 0 0 1 20 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 18.5v-13A2.5 2.5 0 0 1 6.5 3Z"
            />
          </svg>
        </span>

        <div>
          <p class="text-[10px] font-medium uppercase tracking-wider text-base-content/35">
            Pendientes
          </p>

          <p class="text-sm font-bold text-base-content">{{ tickets().length }} solicitudes</p>
        </div>
      </div>
    </div>

    <!-- REQUESTS -->
    <div class="space-y-3">
      @for (ticket of tickets(); track $index) {
        <!-- REQUEST -->
        <button
          type="button"
          class="group flex w-full items-center gap-4 rounded-xl border border-base-300 bg-base-100 px-4 py-4 text-left shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-primary/30 hover:shadow-md sm:px-5"
          (click)="goToTicketDetail(ticket.id)"
        >
          <!-- NUMBER -->
          <div
            class="hidden shrink-0 sm:flex h-10 w-10 items-center justify-center rounded-xl bg-base-200 text-xs font-bold text-base-content/50 transition-colors duration-200 group-hover:bg-primary/10 group-hover:text-primary"
          >
            #{{ ticket.id }}
          </div>

          <!-- MAIN -->
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-2">
              <ticket-status [ticketStatus]="ticket.status" />
              <ticket-priority [ticketPriority]="ticket.priority" />
            </div>

            <h3 class="mt-1.5 truncate text-sm font-bold text-base-content sm:text-base">
              {{ ticket.title }}
            </h3>

            <p class="mt-1 line-clamp-1 text-xs text-base-content/50">
              {{ ticket.description }}
            </p>

            <div class="mt-2.5 flex flex-wrap items-center gap-x-4 gap-y-1.5">
              <span class="flex items-center gap-1.5 text-[10px] text-base-content/45">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-3.5 w-3.5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 13.5v-7Z"
                  />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 20h8M12 16v4" />
                </svg>
                {{ ticket.deviceType }}
              </span>

              <span class="flex items-center gap-1.5 text-[10px] text-base-content/45">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-3.5 w-3.5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <circle cx="9" cy="7" r="4" />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M3 20a6 6 0 0 1 12 0M16 11h5M18.5 8.5v5"
                  />
                </svg>
                {{ ticket.user?.fullname }}
              </span>

              <span class="flex items-center gap-1.5 text-[10px] text-base-content/45">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-3.5 w-3.5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2" />
                  <circle cx="12" cy="12" r="9" />
                </svg>
                {{ getTimeAgo(ticket.createdAt) }}
              </span>
            </div>
          </div>

          <!-- CATEGORY -->
          <div class="hidden shrink-0 border-l border-base-300 pl-5 md:block">
            <p class="text-[9px] font-semibold uppercase tracking-wider text-base-content/35">
              Categoría
            </p>

            <p class="mt-1 text-xs font-semibold text-base-content/70">
              {{ ticket.categoryTicket }}
            </p>
          </div>

          <!-- ARROW -->
          <div
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-base-200 text-base-content/35 transition-all duration-200 group-hover:bg-primary/10 group-hover:text-primary"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4 transition-transform duration-200 group-hover:translate-x-0.5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
            </svg>
          </div>
        </button>
      }
    </div>
  </div>
}
