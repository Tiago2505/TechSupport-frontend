<div class="flex flex-wrap items-center gap-2">
  <button
    type="button"
    class="btn btn-sm rounded-xl border border-base-300 bg-base-100 shadow-sm"
    (click)="sortAsQueue()()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-4 w-4"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1.8"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h12M4 18h8" />
    </svg>

    Ordenar en cola
  </button>

  <button
    type="button"
    class="btn btn-sm rounded-xl border border-base-300 bg-base-100 shadow-sm"
    (click)="sortAsStack()()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-4 w-4"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1.8"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 4h12M6 10h12M6 16h12M6 22h12" />
    </svg>

    Ordenar en pila
  </button>
</div>
