<section class="mb-5 rounded-2xl border border-base-300 bg-base-100 p-5 shadow-sm sm:p-6">
  <div class="mb-5">
    <h2 class="text-sm font-bold text-base-content">Seguimiento del ticket</h2>

    <p class="mt-1 text-xs text-base-content/45">Consulta el progreso de tu solicitud.</p>
  </div>

  <div class="relative">
    <!-- LINE -->
    <div class="absolute left-4 top-4 hidden h-0.5 w-[calc(100%-2rem)] bg-base-300 sm:block"></div>

    <div class="relative grid grid-cols-1 gap-5 sm:grid-cols-3 sm:gap-3">
      <!-- CREATED -->
      <div class="flex items-center gap-3 sm:flex-col sm:items-center sm:text-center">
        <div
          class="relative z-10 flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-success text-success-content shadow-sm"
        >
          <check-status-icon />
        </div>

        <div>
          <p class="text-xs font-semibold text-base-content">Creado</p>

          <p class="mt-0.5 text-[10px] text-base-content/40">Ticket creado</p>
        </div>
      </div>

      <!-- ASSIGNED -->
      <div class="flex items-center gap-3 sm:flex-col sm:items-center sm:text-center">
        @if (isAssignedCompleted()) {
          <!-- COMPLETED -->
          <div
            class="relative z-10 flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-success text-success-content shadow-sm"
          >
            <check-status-icon />
          </div>

          <div>
            <p class="text-xs font-semibold text-base-content">Asignado</p>

            <p class="mt-0.5 text-[10px] text-base-content/40">Técnico asignado</p>
          </div>
        } @else {
          <!-- CURRENT -->
          <div
            class="relative z-10 flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-primary text-primary-content shadow-md shadow-primary/20"
          >
            <span class="h-2.5 w-2.5 rounded-full bg-current"></span>
          </div>

          <div>
            <p class="text-xs font-semibold text-primary">Asignado</p>

            <p class="mt-0.5 text-[10px] text-base-content/40">Pendiente</p>
          </div>
        }
      </div>

      <!-- RESOLVED -->
      <div class="flex items-center gap-3 sm:flex-col sm:items-center sm:text-center">
        @if (isResolvedCompleted()) {
          <!-- COMPLETED -->
          <div
            class="relative z-10 flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-success text-success-content shadow-sm"
          >
            <check-status-icon />
          </div>

          <div>
            <p class="text-xs font-semibold text-base-content">Resuelto</p>

            <p class="mt-0.5 text-[10px] text-base-content/40">Completado</p>
          </div>
        } @else {
          <!-- CURRENT / NEXT -->
          <div
            class="relative z-10 flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-primary text-primary-content shadow-md shadow-primary/20"
          >
            <span class="h-2.5 w-2.5 rounded-full bg-current"></span>
          </div>

          <div>
            <p class="text-xs font-semibold text-primary">Resuelto</p>

            <p class="mt-0.5 text-[10px] text-base-content/40">Pendiente</p>
          </div>
        }
      </div>
    </div>
  </div>
</section>
