<section
  class="overflow-hidden rounded-2xl border border-base-300/70 bg-gradient-to-br from-base-100 via-base-100 to-base-200/30 shadow-sm"
>
  <div class="flex min-h-[280px] flex-col items-center justify-center px-6 py-10 text-center">
    <!-- ICON -->
    <div
      class="flex h-14 w-14 items-center justify-center rounded-2xl border border-primary/15 bg-primary/10 text-primary"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-7 w-7"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.7"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m18 0h-2M5 15H3m18 0h-2M7 7h10v10H7V7z"
        />

        <path stroke-linecap="round" stroke-linejoin="round" d="M10 11h.01M14 11h.01M9.5 15h5" />
      </svg>
    </div>

    <!-- CONTENT -->
    <div class="mt-5 max-w-sm">
      <div class="flex items-center justify-center gap-2">
        <h3 class="text-sm font-bold text-base-content">Sin diagnóstico disponible</h3>

        <span
          class="rounded-full border border-base-300 bg-base-200 px-2 py-0.5 text-[9px] font-bold uppercase tracking-wider text-base-content/40"
        >
          AI
        </span>
      </div>

      <p class="mt-2 text-xs leading-5 text-base-content/50">
        Todavía no se ha generado un diagnóstico de inteligencia artificial para este ticket.
      </p>
    </div>

    <!-- STATUS -->
    <div
      class="mt-6 flex items-center gap-2 rounded-xl border border-base-300/60 bg-base-200/50 px-3.5 py-2.5"
    >
      <span class="h-1.5 w-1.5 rounded-full bg-base-content/30"></span>

      <p class="text-[10px] font-semibold uppercase tracking-wider text-base-content/40">
        Diagnóstico pendiente
      </p>
    </div>

    <!-- INFO -->
    <div class="mt-6 flex max-w-sm items-start gap-2 border-t border-base-300/60 pt-4 text-left">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="mt-0.5 h-3.5 w-3.5 shrink-0 text-base-content/30"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <circle cx="12" cy="12" r="9" />

        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4" />

        <path stroke-linecap="round" d="M12 16h.01" />
      </svg>

      <p class="text-[10px] leading-4 text-base-content/40">
        El diagnóstico aparecerá aquí cuando se encuentre disponible para este ticket.
      </p>
    </div>
  </div>
</section>
