<div class="fixed top-0 left-0 right-0 z-9999 flex w-full justify-center">
  @if (claimedTicket() && showMessage()) {
    <success-message
      messageTitle="Ticket claimed successfully"
      messageContent="The ticket has been successfully assigned to you. You can now begin working on it."
    />
  } @else if (showMessage() && !claimedTicket()) {
    <error-message
      messageTitle="Unable to claim ticket"
      messageContent="We couldn't assign this ticket to you. Please try again or verify that the ticket is still available."
    />
  }
</div>

@if (claimTicketRxResource.isLoading()) {
  <is-loading />
}

<div class="mb-6">
  <button
    type="button"
    class="btn btn-ghost btn-sm -ml-2 mb-4 gap-2 rounded-lg text-base-content/60 hover:text-base-content"
    (click)="goToAllTickets()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-4 w-4"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
    </svg>

    Volver a los tickets
  </button>

  <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <!-- INFORMACIÓN DEL TICKET -->
    <div class="min-w-0">
      <div class="mb-2 flex flex-wrap items-center gap-2">
        <span
          class="rounded-md bg-base-300 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-base-content/50"
        >
          #{{ ticketId() }}
        </span>

        <ticket-status [ticketStatus]="ticketStatus()" />

        <ticket-priority [ticketPriority]="priorityTicket()" />
      </div>

      <h1 class="text-2xl font-bold tracking-tight text-base-content sm:text-3xl">
        {{ ticketTitle() }}
      </h1>
    </div>

    <!-- ACCIONES -->
    <div class="flex shrink-0 flex-col gap-2 sm:flex-row sm:items-center">
      <!-- ÚLTIMA ACTUALIZACIÓN -->
      <div
        class="flex items-center gap-2 rounded-xl border border-base-300 bg-base-100 px-3 py-2 shadow-sm"
      >
        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary/10 text-primary">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2" />
            <circle cx="12" cy="12" r="9" />
          </svg>
        </div>

        <div>
          <p class="text-[10px] font-medium uppercase tracking-wider text-base-content/35">
            Última actualización
          </p>

          <p class="text-xs font-semibold text-base-content">
            {{ getTimeAgo() }}
          </p>
        </div>
      </div>

      <!-- ACTUALIZAR GESTIÓN -->
      <button
        type="button"
        class="btn btn-outline gap-2 rounded-xl px-4 transition-all duration-200 hover:border-primary hover:bg-primary/10 hover:text-primary"

        (click)="goToUpdateTicket()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16.862 3.487a2.25 2.25 0 113.182 3.182L8.25 18.464 4 19.5l1.036-4.25L16.862 3.487z"
          />
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.5 5.5l4 4" />
        </svg>

        <span>Actualizar gestión</span>
      </button>

      <!-- RECOGER GESTIÓN -->
      <button
        type="button"
        class="btn btn-primary gap-2 rounded-xl px-4 shadow-sm shadow-primary/20 transition-all duration-200 hover:shadow-md hover:shadow-primary/25"
        (click)="claimTicketButton(ticketId())"
      >
        <span>Recoger</span>
      </button>
    </div>
  </div>
</div>
