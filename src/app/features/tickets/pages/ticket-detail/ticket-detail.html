@if (ticketDetailRxResource.hasValue()) {
  <div class="min-h-screen bg-base-200/40">
    <div class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
      <!-- HEADER -->
      <ticket-detail-header
        [ticketId]="ticketInformation()!.id"
        [ticketStatus]="ticketInformation()!.status"
        [priorityTicket]="ticketInformation()!.priority"
        [ticketTitle]="ticketInformation()!.title"
        [lastUpdate]="ticketNotes().length ? getLastNoteCreatedAt() : ticketInformation()!.createdAt "
      />

      <!-- STATUS TIMELINE -->
      <ticket-detail-status-timeline [ticketStatus]="ticketInformation()!.status" [assignedTechnician]="!!ticketInformation()?.technician" />

      <!-- MAIN GRID -->
      <div class="grid grid-cols-1 items-start gap-5 lg:grid-cols-3">
        <!-- LEFT -->
        <div class="min-w-0 lg:col-span-2">
          <ticket-detail-left-sidebar [ticket]="ticketInformation()!" />
        </div>

        <!-- RIGHT -->
        <div class="min-w-0">
          <ticket-detail-right-sidebar [ticket]="ticketInformation()!" />
        </div>
      </div>
    </div>
  </div>
} @else if (ticketDetailRxResource.isLoading()) {
  <is-loading />
} @else {
  <not-found entityNotFoundName="ticket" />
}
