<div class="mb-7 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
  <div>
    <div class="flex items-center gap-3">
      <div
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-primary text-primary-content shadow-sm"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5.5 w-5.5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 14.25h6M9 17.25h3M7.5 3h6.75L18 6.75v13.5A1.75 1.75 0 0 1 16.25 22h-8.5A1.75 1.75 0 0 1 6 20.25V4.75A1.75 1.75 0 0 1 7.75 3Z"
          />
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.25 3v4h4" />
        </svg>
      </div>

      <div>
        <h1 class="text-2xl font-bold tracking-tight text-base-content sm:text-3xl">Mis tickets</h1>

        <p class="mt-0.5 text-sm text-base-content/55">
          Consulta y da seguimiento a tus solicitudes de soporte.
        </p>
      </div>
    </div>
  </div>

  <!-- TOTAL -->
  <div
    class="flex w-fit items-center gap-3 rounded-2xl border border-base-300 bg-base-100 px-4 py-2.5 shadow-sm"
  >
    <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary/10 text-primary">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-4 w-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 6h13M8 12h13M8 18h13" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 6h.01M3 12h.01M3 18h.01" />
      </svg>
    </div>

    <div>
      <p class="text-[11px] font-medium uppercase tracking-wider text-base-content/40">Tickets</p>

      <p class="text-sm font-bold text-base-content">
        {{ totalTickets() }}
      </p>
    </div>
  </div>
</div>
