<div class="flex items-center justify-between bg-primary px-5 py-4 text-primary-content">
  <div class="flex items-center gap-3">
    <!-- ICONO IA -->
    <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-primary-content/10">
      <chatbot-icon />
    </div>

    <div>
      <h2 class="font-bold">Asistente IA</h2>

      <p class="text-xs text-primary-content/70">Disponible para ayudarte</p>
    </div>
  </div>

  <!-- CERRAR CHAT -->
  <button
    type="button"
    class="btn btn-circle btn-ghost btn-sm text-primary-content hover:bg-primary-content/10"
    aria-label="Cerrar chat"
    (click)="closeChat()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-5 w-5"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>
</div>
