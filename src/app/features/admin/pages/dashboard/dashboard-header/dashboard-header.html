<section
  class="overflow-hidden rounded-2xl border border-primary/20 bg-linear-to-br from-primary/10 via-base-100 to-base-100 shadow-sm"
>
  <div class="p-5 sm:p-6">
    <div class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">
      <!-- HEADER -->
      <div class="flex items-start gap-4">
        <div
          class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-primary text-primary-content shadow-sm"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </div>

        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold text-base-content sm:text-xl">Panel administrativo</h1>

            <span
              class="rounded-full border border-primary/20 bg-primary/10 px-2 py-0.5 text-[9px] font-bold uppercase tracking-wider text-primary"
            >
              Admin
            </span>
          </div>

          <p class="mt-1 max-w-xl text-xs leading-5 text-base-content/50 sm:text-sm">
            Gestiona tickets, usuarios y consulta la actividad del sistema desde un solo lugar.
          </p>
        </div>
      </div>

      <!-- USER -->
      <div
        class="flex items-center gap-3 rounded-xl border border-base-300/70 bg-base-100/70 px-3.5 py-2.5 shadow-sm"
      >
        <!-- AVATAR -->
        <div
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-primary/10 text-xs font-bold text-primary"
        >
          {{currentUser().fullname | initials}}
        </div>

        <!-- USER INFO -->
        <div class="min-w-0">
          <p class="text-[9px] font-bold uppercase tracking-wider text-base-content/35">
            Administrador
          </p>

          <p class="mt-0.5 max-w-45 truncate text-xs font-semibold text-base-content">
            {{currentUser().fullname}}
          </p>
        </div>

        <!-- STATUS -->
        <span class="ml-1 h-2 w-2 shrink-0 rounded-full bg-success" title="Usuario activo"></span>
      </div>
    </div>
  </div>
</section>
